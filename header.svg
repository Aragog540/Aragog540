<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <!-- Professional Tech Gradient (Blue -> Violet -> Teal) -->
    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>   <!-- Royal Blue -->
      <stop offset="50%" stop-color="#6366f1"/>  <!-- Indigo -->
      <stop offset="100%" stop-color="#14b8a6"/> <!-- Teal -->
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>

    <!-- Fonts and Styles -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&amp;family=JetBrains+Mono:wght@400;700&amp;family=Inter:wght@400;500;700&amp;display=swap');
      
      .name-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
        letter-spacing: 1px;
      }
      
      .math-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        fill: #38bdf8;
        opacity: 0.18;
      }

      .math-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        fill: #94a3b8;
        opacity: 0.12;
      }

      .tagline {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 500;
        font-size: 15px;
        fill: #94a3b8;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      .subtitle {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 1px;
      }
      
      .bracket {
        fill: #38bdf8;
        font-weight: 700;
      }

      /* Slow fade/slide for subtitles */
      @keyframes subtitleCycle1 {
        0%, 100% { opacity: 0; transform: translateY(8px); }
        4%, 28% { opacity: 1; transform: translateY(0px); }
        32% { opacity: 0; transform: translateY(-8px); }
        96% { opacity: 0; transform: translateY(8px); }
      }
      
      @keyframes subtitleCycle2 {
        0%, 32% { opacity: 0; transform: translateY(8px); }
        36%, 60% { opacity: 1; transform: translateY(0px); }
        64% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(8px); }
      }
      
      @keyframes subtitleCycle3 {
        0%, 64% { opacity: 0; transform: translateY(8px); }
        68%, 92% { opacity: 1; transform: translateY(0px); }
        96% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(8px); }
      }

      .sub-item-1 { animation: subtitleCycle1 12s infinite ease-in-out; }
      .sub-item-2 { animation: subtitleCycle2 12s infinite ease-in-out; }
      .sub-item-3 { animation: subtitleCycle3 12s infinite ease-in-out; }

      /* Wave/Flow Animation */
      @keyframes waveOffset {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1000; }
      }
      
      .wave-line {
        stroke-dasharray: 12 12;
        animation: waveOffset 45s linear infinite;
      }

      .wave-pulse {
        stroke-dasharray: 50 150;
        animation: waveOffset 15s linear infinite;
      }

      /* Subtle grid animation */
      @keyframes gridPulse {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.15; }
      }
      .grid-bg {
        animation: gridPulse 8s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="300" fill="url(#bg)"/>
  
  <!-- Subtle Matrix/Grid Overlay -->
  <g class="grid-bg" stroke="url(#gridGlow)" stroke-width="0.5">
    <path d="M 0,50 L 850,50 M 0,100 L 850,100 M 0,150 L 850,150 M 0,200 L 850,200 M 0,250 L 850,250" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300" />
  </g>

  <!-- Sleek Professional Borders -->
  <rect x="15" y="15" width="820" height="270" rx="6" fill="none" stroke="url(#techGlow)" stroke-width="1" opacity="0.2"/>
  <rect x="16" y="16" width="818" height="268" rx="5" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>

  <!-- Ambient blue/teal spots -->
  <circle cx="200" cy="120" r="120" fill="#3b82f6" opacity="0.08" filter="url(#ambient)" />
  <circle cx="680" cy="150" r="90" fill="#14b8a6" opacity="0.06" filter="url(#ambient)" />

  <!-- Math & Neural Code Background Context -->
  <g class="math-text">
    <text x="40" y="50">Attention(Q, K, V) = softmax(QKᵀ / √d_k)V</text>
    <text x="40" y="270">L_cGAN(G, D) = E[log D(x, y)] + E[log(1 - D(x, G(x, z)))]</text>
  </g>
  
  <g class="math-sub">
    <text x="500" y="50">E_x[||y - G(x)||_1]</text>
    <text x="710" y="270">z ~ p_z(z)</text>
    <text x="40" y="250">U-NetMamba Spatial Attention Grid [s_i, w_i]</text>
  </g>

  <!-- Left Side: Profile Information -->
  <g transform="translate(55, 90)">
    <!-- Tech Tagline Label -->
    <text class="tagline" x="0" y="0">AI/ML ENGINEER &amp; RESEARCHER</text>
    
    <!-- Title -->
    <text class="name-title" x="0" y="45">Swaroop Bhowmik</text>
    
    <!-- Underline bar -->
    <rect x="0" y="62" width="120" height="2" fill="url(#techGlow)" rx="1"/>

    <!-- Rotating Professional Subtitles -->
    <g transform="translate(0, 105)">
      <!-- Role 1 -->
      <g class="sub-item-1">
        <text class="subtitle" x="0" y="0" fill="#38bdf8"><tspan class="bracket">[</tspan> Deep Learning Architecture &amp; Optimization <tspan class="bracket">]</tspan></text>
      </g>
      <!-- Role 2 -->
      <g class="sub-item-2">
        <text class="subtitle" x="0" y="0" fill="#a78bfa"><tspan class="bracket">[</tspan> Computer Vision &amp; Generative Adversarial Networks <tspan class="bracket">]</tspan></text>
      </g>
      <!-- Role 3 -->
      <g class="sub-item-3">
        <text class="subtitle" x="0" y="0" fill="#2dd4bf"><tspan class="bracket">[</tspan> Intelligent RAG Pipelines &amp; Multi-Agent Systems <tspan class="bracket">]</tspan></text>
      </g>
    </g>
  </g>

  <!-- Right Side: Sophisticated Self-Attention Wave / Latent Space representation -->
  <g transform="translate(490, 80)">
    <!-- Conceptual Latent Vectors / Node points -->
    <g stroke="url(#techGlow)" stroke-width="0.5" fill="none">
      <!-- Wave 1: Cyan -->
      <path d="M 0,70 Q 60,-20 120,70 T 240,70" stroke="#14b8a6" stroke-width="0.8" opacity="0.3" class="wave-line"/>
      <path d="M 0,70 Q 60,-20 120,70 T 240,70" stroke="#14b8a6" stroke-width="1.2" opacity="0.6" class="wave-pulse"/>
      
      <!-- Wave 2: Royal Blue (Shifted) -->
      <path d="M 0,60 Q 60,130 120,60 T 240,60" stroke="#3b82f6" stroke-width="1.0" opacity="0.4" class="wave-line" style="animation-delay: -10s;"/>
      <path d="M 0,60 Q 60,130 120,60 T 240,60" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" class="wave-pulse" style="animation-delay: -5s;"/>
      
      <!-- Wave 3: Violet (Shifted) -->
      <path d="M 0,80 Q 70,20 130,80 T 240,80" stroke="#8b5cf6" stroke-width="0.6" opacity="0.25" class="wave-line" style="animation-delay: -20s;"/>
    </g>

    <!-- Synapses Nodes on the Waves (Points of high attention) -->
    <g fill="#ffffff">
      <!-- Synapse 1 -->
      <circle cx="60" cy="25" r="2.5" fill="#14b8a6" filter="url(#softGlow)"/>
      <line x1="60" y1="25" x2="60" y2="95" stroke="#14b8a6" stroke-dasharray="2 2" stroke-width="0.5" opacity="0.4"/>
      
      <!-- Synapse 2 -->
      <circle cx="120" cy="70" r="3" fill="#ffffff" filter="url(#softGlow)"/>
      
      <!-- Synapse 3 -->
      <circle cx="180" cy="95" r="2.5" fill="#3b82f6" filter="url(#softGlow)"/>
      <line x1="180" y1="95" x2="180" y2="35" stroke="#3b82f6" stroke-dasharray="2 2" stroke-width="0.5" opacity="0.4"/>

      <!-- Synapse 4 -->
      <circle cx="130" cy="80" r="2" fill="#8b5cf6"/>
    </g>
    
    <!-- Code coordinates tags -->
    <g font-family="JetBrains Mono, monospace" font-size="8" fill="#94a3b8" opacity="0.4">
      <text x="50" y="15">h_i</text>
      <text x="170" y="115">h_{i+1}</text>
      <text x="110" y="55">α_k</text>
    </g>
  </g>
</svg>
