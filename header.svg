<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711"/>
      <stop offset="50%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#9b51e0"/>
      <stop offset="90%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>

    <!-- Pulse Gradient for Connections -->
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9b51e0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
      </feMerge>
    </filter>

    <!-- Import Premium Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&amp;family=Space+Grotesk:wght@400;700&amp;family=Fira+Code:wght@400;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#textGlow);
        letter-spacing: 2px;
      }
      
      .subtitle-label {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #635e80;
        font-weight: 700;
      }

      .subtitle {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      
      .bracket {
        fill: #00f2fe;
        font-weight: 700;
      }
      
      .role-1, .role-2, .role-3 {
        position: absolute;
        transform-origin: 100px 185px;
      }

      /* Sliding and fading transitions for the subtitle loop */
      @keyframes roleAnimation1 {
        0%, 100% { opacity: 0; transform: translateY(15px); }
        3%, 28% { opacity: 1; transform: translateY(0px); }
        31% { opacity: 0; transform: translateY(-15px); }
        97% { opacity: 0; transform: translateY(15px); }
      }
      
      @keyframes roleAnimation2 {
        0%, 31% { opacity: 0; transform: translateY(15px); }
        34%, 61% { opacity: 1; transform: translateY(0px); }
        64% { opacity: 0; transform: translateY(-15px); }
        100% { opacity: 0; transform: translateY(15px); }
      }
      
      @keyframes roleAnimation3 {
        0%, 64% { opacity: 0; transform: translateY(15px); }
        67%, 94% { opacity: 1; transform: translateY(0px); }
        97% { opacity: 0; transform: translateY(-15px); }
        100% { opacity: 0; transform: translateY(15px); }
      }

      .role-1 { animation: roleAnimation1 12s infinite ease-in-out; }
      .role-2 { animation: roleAnimation2 12s infinite ease-in-out; }
      .role-3 { animation: roleAnimation3 12s infinite ease-in-out; }

      /* Pulse line animation */
      .pulse-link {
        stroke-dasharray: 40 180;
        animation: flow 5s linear infinite;
      }
      
      @keyframes flow {
        from { stroke-dashoffset: 220; }
        to { stroke-dashoffset: 0; }
      }

      /* Floating background particles */
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-10px) translateX(5px); opacity: 0.6; }
      }

      .particle-1 { animation: floatParticle 6s infinite ease-in-out; }
      .particle-2 { animation: floatParticle 8s infinite ease-in-out 1s; }
      .particle-3 { animation: floatParticle 7s infinite ease-in-out 2s; }
    </style>
  </defs>

  <!-- Background Card Representation -->
  <rect width="850" height="300" fill="url(#bg)"/>
  <rect x="8" y="8" width="834" height="284" rx="16" fill="none" stroke="url(#textGlow)" stroke-width="1.2" opacity="0.3"/>
  <rect x="9" y="9" width="832" height="282" rx="15" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- Ambient background glow behind title -->
  <circle cx="280" cy="150" r="100" fill="#9b51e0" opacity="0.1" filter="url(#softGlow)" />
  <circle cx="680" cy="140" r="80" fill="#00f2fe" opacity="0.08" filter="url(#softGlow)" />

  <!-- Background grid or coding artifacts -->
  <g opacity="0.08" class="particle-2">
    <text x="30" y="45" font-family="Fira Code, monospace" font-size="11" fill="#fff">const swaroop = new AIEngineer();</text>
    <text x="30" y="65" font-family="Fira Code, monospace" font-size="11" fill="#fff">swaroop.optimize({ dehazing: 0.99, rag: true });</text>
    <text x="30" y="265" font-family="Fira Code, monospace" font-size="11" fill="#fff">import tensorflow as tf</text>
    <text x="30" y="280" font-family="Fira Code, monospace" font-size="11" fill="#fff">import langgraph as lg</text>
  </g>

  <!-- Floating Star Elements -->
  <g opacity="0.3">
    <circle cx="90" cy="70" r="1.5" fill="#00f2fe" class="particle-1"/>
    <circle cx="480" cy="50" r="1" fill="#ff007f" class="particle-3"/>
    <circle cx="420" cy="250" r="2" fill="#fff" class="particle-2"/>
    <circle cx="150" cy="270" r="1" fill="#9b51e0" class="particle-1"/>
  </g>

  <!-- Left Side: Profile Text Information -->
  <g transform="translate(60, 100)">
    <!-- Tech Label -->
    <text class="subtitle-label" x="0" y="0">System.out.println("Hello, World!");</text>
    
    <!-- Title: Swaroop Bhowmik -->
    <text class="title" x="0" y="45" filter="url(#glow)">SWAROOP BHOWMIK</text>
    
    <!-- Role loops -->
    <g transform="translate(0, 85)">
      <g class="role-1">
        <text class="subtitle" x="0" y="0" fill="#00f2fe"><tspan class="bracket">&lt;</tspan> AI / ML Engineer <tspan class="bracket">/&gt;</tspan></text>
      </g>
      <g class="role-2">
        <text class="subtitle" x="0" y="0" fill="#9b51e0"><tspan class="bracket">&lt;</tspan> Deep Learning Researcher <tspan class="bracket">/&gt;</tspan></text>
      </g>
      <g class="role-3">
        <text class="subtitle" x="0" y="0" fill="#ff007f"><tspan class="bracket">&lt;</tspan> Patent Holder &amp; Innovator <tspan class="bracket">/&gt;</tspan></text>
      </g>
    </g>
  </g>

  <!-- Right Side: Neural Network Connections Graphic -->
  <g transform="translate(40, 0)">
    <!-- Default Connection Lines -->
    <g stroke="#37315a" stroke-width="0.8" opacity="0.5">
      <!-- Input to Hidden Layer -->
      <line x1="580" y1="90" x2="660" y2="75"/>
      <line x1="580" y1="90" x2="660" y2="115"/>
      <line x1="580" y1="90" x2="660" y2="155"/>
      <line x1="580" y1="90" x2="660" y2="195"/>

      <line x1="580" y1="140" x2="660" y2="75"/>
      <line x1="580" y1="140" x2="660" y2="115"/>
      <line x1="580" y1="140" x2="660" y2="155"/>
      <line x1="580" y1="140" x2="660" y2="195"/>

      <line x1="580" y1="190" x2="660" y2="75"/>
      <line x1="580" y1="190" x2="660" y2="115"/>
      <line x1="580" y1="190" x2="660" y2="155"/>
      <line x1="580" y1="190" x2="660" y2="195"/>

      <!-- Hidden to Output Layer -->
      <line x1="660" y1="75" x2="740" y2="115"/>
      <line x1="660" y1="75" x2="740" y2="165"/>
      
      <line x1="660" y1="115" x2="740" y2="115"/>
      <line x1="660" y1="115" x2="740" y2="165"/>

      <line x1="660" y1="155" x2="740" y2="115"/>
      <line x1="660" y1="155" x2="740" y2="165"/>

      <line x1="660" y1="195" x2="740" y2="115"/>
      <line x1="660" y1="195" x2="740" y2="165"/>
    </g>

    <!-- Flowing Pulses Overlay -->
    <g stroke="url(#textGlow)" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M 580,90 L 660,115 L 740,165" class="pulse-link"/>
      <path d="M 580,190 L 660,155 L 740,115" class="pulse-link" style="animation-delay: -1.5s;"/>
      <path d="M 580,140 L 660,75 L 740,165" class="pulse-link" style="animation-delay: -3s;"/>
      <path d="M 580,190 L 660,195 L 740,165" class="pulse-link" style="animation-delay: -0.7s;"/>
    </g>

    <!-- Node Circles -->
    <g>
      <!-- Input Layer Nodes -->
      <circle cx="580" cy="90" r="4.5" fill="#00f2fe">
        <animate attributeName="r" values="4.5;6.5;4.5" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="580" cy="140" r="4.5" fill="#00f2fe">
        <animate attributeName="r" values="4.5;5.5;4.5" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="580" cy="190" r="4.5" fill="#00f2fe">
        <animate attributeName="r" values="4.5;6;4.5" dur="2.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Hidden Layer Nodes -->
      <circle cx="660" cy="75" r="4.5" fill="#9b51e0"/>
      <circle cx="660" cy="115" r="4.5" fill="#9b51e0">
        <animate attributeName="r" values="4.5;6.5;4.5" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="660" cy="155" r="4.5" fill="#9b51e0"/>
      <circle cx="660" cy="195" r="4.5" fill="#9b51e0">
        <animate attributeName="r" values="4.5;5.5;4.5" dur="4.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Output Layer Nodes -->
      <circle cx="740" cy="115" r="5.5" fill="#ff007f" filter="url(#glow)">
        <animate attributeName="r" values="5.5;7.5;5.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="740" cy="165" r="5.5" fill="#ff007f" filter="url(#glow)">
        <animate attributeName="r" values="5.5;8;5.5" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
